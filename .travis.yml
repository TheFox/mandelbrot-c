language: c
compiler:
    - clang
    - gcc
install:
    - sudo apt-get install -y libimlib2-dev
    - sudo apt-get install -y libgomp1
    - find /usr/ -type f -iname 'omp.h'
    - find /usr/ -type f -iname '*gomp*'
    - mkdir build
    - cd build
    - cmake .. 
    - make VERBOSE=1
script: make test